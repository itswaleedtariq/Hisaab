name: CI

on:
  push:
  pull_request:
    branches: [develop, main]

jobs:
  test:
    # Required status check on develop and main (see BRANCHING.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests with coverage
        # Report-only at M2. Before M3 this becomes --cov-fail-under=60 (QR-12).
        run: pytest --cov=hisaab --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  quality:
    # Static-analysis evidence for SE431 (QR-11, QR-13, QR-14). Not a merge gate at M2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pylint
        run: pylint hisaab --exit-zero --output-format=text | tee pylint.txt
      - name: Bandit
        run: bandit -r hisaab -f txt -o bandit.txt --exit-zero && cat bandit.txt
      - name: Radon cyclomatic complexity
        run: radon cc hisaab -s -a | tee radon-cc.txt
      - name: Upload static-analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis
          path: |
            pylint.txt
            bandit.txt
            radon-cc.txt
